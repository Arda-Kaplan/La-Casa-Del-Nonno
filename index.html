<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Casa del Nonno Webpanel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090604;color:#f7dfad;font-family:Georgia,serif;min-height:100vh;padding:20px}
body::before{content:"";position:fixed;inset:0;background:url("logo.png") center top/900px no-repeat;opacity:.13;z-index:-1}
.container{width:99%;max-width:2200px;margin:auto}
.logo{width:190px;height:190px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;border:3px solid #b67a2a}
h1{text-align:center;font-size:46px;color:#d7a24a}
.subtitle{text-align:center;color:#f0c982;margin-bottom:20px;font-size:20px}
.employee-box{text-align:center;margin-bottom:25px}
.employee-box label{font-size:22px;color:#d7a24a}
.employee-box select{padding:10px 15px;font-size:18px;border-radius:8px;background:#2b1608;color:#f7dfad;border:1px solid #b67a2a;margin-left:10px}
.top-actions{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.panel{border:1px solid #b67a2a;border-radius:14px;background:linear-gradient(#5b0c0c,#160b05 18%);overflow:hidden}
.panel h2{text-align:center;color:#d7a24a;padding:18px;font-size:36px;border-bottom:1px solid #6f3f12}
.item{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:20px;padding:18px;border-bottom:1px solid #3b220d}
.food-icon{font-size:52px;text-align:center}
.name{font-size:24px;font-weight:bold;color:#fff2c8}
.price,.stock{font-size:18px;color:#f0c982;margin-top:6px}
.low-stock{color:#ff6b6b;font-weight:bold}
.choice-select{width:100%;min-width:380px;margin-top:12px;padding:16px 20px;background:#2b1608;color:#f7dfad;border:2px solid #d7a24a;border-radius:10px;font-size:20px;font-weight:bold}
.controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.qty{min-width:38px;text-align:center;font-size:22px;color:#f7dfad}
button{font-family:Georgia,serif;cursor:pointer;border:1px solid #b67a2a;background:#6b1412;color:#f7dfad;border-radius:6px;padding:8px 12px;font-size:15px}
button:hover{background:#9b211d}
.small{min-width:35px;height:30px;padding:0 8px;font-size:16px;background:#2b1608}
.quick{background:#3c210b;color:#ffd27a}.add-btn{background:#7b1815}
.bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}
.order-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px;border-bottom:1px solid #3b220d;font-size:18px}
.remove{padding:4px 10px}
.discount-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:18px}
.total{margin:15px;padding:15px;border:1px solid #6f3f12;border-radius:12px;text-align:center;font-size:38px;color:#d7a24a}
.finish{width:100%;margin-top:12px;padding:20px;font-size:30px;color:#d7a24a}
.footer{text-align:center;margin-top:10px;color:#d7a24a;letter-spacing:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;padding:30px;overflow:auto}
.modal-content{max-width:950px;margin:auto;background:#160b05;border:1px solid #b67a2a;border-radius:16px;padding:20px}
.inventory-row{display:grid;grid-template-columns:1fr 140px;gap:10px;padding:10px;border-bottom:1px solid #3b220d;align-items:center}
.inventory-row input{padding:8px;background:#2b1608;color:#f7dfad;border:1px solid #b67a2a;border-radius:6px;font-size:16px}
.loading{text-align:center;padding:20px;color:#d7a24a;font-size:20px}
@media(max-width:1200px){.grid{grid-template-columns:1fr 1fr}.choice-select{min-width:260px}}
@media(max-width:900px){.grid,.bottom{grid-template-columns:1fr}h1{font-size:34px}.item{grid-template-columns:65px 1fr}.controls{grid-column:1 / -1;justify-content:flex-start}.choice-select{min-width:100%;font-size:16px}}
</style>
</head>
<body>
<div class="container">
<img src="logo.png" class="logo">
<h1>LA CASA DEL NONNO</h1>
<div class="subtitle">CAFFÈ & DOLCI FATTI CON AMORE</div>
<div class="employee-box">
<label for="employee">Mitarbeiter:</label>
<select id="employee"><option>Carlo</option><option>Arda</option><option>Fliesko</option><option>Thomas</option><option>Juan</option></select>
</div>
<div class="top-actions"><button onclick="openInventory()">📦 Inventur öffnen</button></div>
<div id="loadingText" class="loading">Lager wird aus Firebase geladen...</div>
<div class="grid" id="menu"></div>
<div class="bottom">
<div class="panel"><h2>🛒 BESTELLUNG</h2><div id="orderList"></div></div>
<div class="panel"><h2>🏷️ RABATT</h2><div class="discount-buttons">
<button onclick="setDiscount(5)">5%</button><button onclick="setDiscount(10)">10%</button><button onclick="setDiscount(15)">15%</button><button onclick="setDiscount(20)">20%</button><button onclick="setDiscount(25)">25%</button><button onclick="setDiscount(30)">30%</button><button onclick="setDiscount(35)">35%</button><button onclick="setDiscount(40)">40%</button><button onclick="setDiscount(45)">45%</button><button onclick="setDiscount(50)">50%</button><button onclick="removeDiscount()">↻ Rabatt entfernen</button>
</div><div class="total">GESAMT<br><span id="total">0,00 €</span></div></div>
</div>
<button class="finish" onclick="finishOrder()">🛍️ BESTELLUNG ABSCHLIESSEN</button>
<div class="footer">DOVE OGNI GIORNO HA IL SAPORE DI CASA.</div>
</div>
<div class="modal" id="inventoryModal"><div class="modal-content"><h2 style="text-align:center;color:#d7a24a;margin-bottom:20px;">📦 Inventur / Lagerbestand</h2><div id="inventoryList"></div><br><button onclick="saveInventory()">💾 Lager speichern</button><button onclick="closeInventory()">Schließen</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCzbVs6AHO6h8ena5Y80tL7RqWqsBWn6g",
    authDomain: "la-casa-del-nonno.firebaseapp.com",
    projectId: "la-casa-del-nonno",
    storageBucket: "la-casa-del-nonno.firebasestorage.app",
    messagingSenderId: "751184717495",
    appId: "1:751184717495:web:3452ad5e589591864fcf32"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const inventoryRef = doc(db, "inventory", "stock");

const webhookURL = "https://discord.com/api/webhooks/1512118563182346342/vT3WSKctnKGRsCUuNrzINuBU9lIXZ7sDmwzKaxX-qroo0Ze4NZSuC9SI9YaUazDVJsuo";
const adminPassword = "8462";

const products = {
    "🍷 BEVANDE": [
        ["Vino della Casa", 350, "🍷"], ["Tè Freddo al Limone", 195, "🥤"], ["Cola", 130, "🥃"], ["Energy Drink", 200, "⚡"]
    ],
    "🍕 PIZZA": [
        ["Pizza Margherita", 330, "🍕"], ["Pizza Salame Piccante", 330, "🍕"], ["Pizza Tonno e Cipolla", 330, "🍕"]
    ],
    "🥗 ANTIPASTI": [
        ["Antipasto Italiano della Casa", 110, "🥗"], ["Bruschetta Classica", 165, "🍅"]
    ],
    "🍝 SECONDI PIATTI": [
        ["Lasagna Napoletana della Casa", 550, "🍝"], ["Grigliata Mista di Pesce", 410, "🦐"]
    ],
    "🍝 PASTA": [
        ["Spaghetti alla Carbonara", 300, "🍝"], ["Spaghetti alla Bolognese", 300, "🍝"]
    ],
    "🍮 DESSERT": [
        ["Coppa Gelato della Casa", 400, "🍨"], ["Tiramisu", 275, "🍰"], ["Panna Cotta ai Lamponi Caldi", 110, "🍮"]
    ],
    "⭐ MENÜ 1": [
        ["Menü 1: Eistee + Pizza nach Wahl + Panna Cotta", 540, "🍽️", "menu1"]
    ],
    "⭐ MENÜ 2": [
        ["Menü 2: Cola + Pasta nach Wahl + Tiramisu", 600, "🍽️", "menu2"]
    ],
    "⭐ MENÜ 3": [
        ["Menü 3: Energy Drink + Grigliata Mista di Pesce + Coppa Gelato", 860, "🍽️", "menu3"]
    ]
};

const menuRecipes = {
    menu1: {
        choices: { pizza: ["Pizza Margherita", "Pizza Salame Piccante", "Pizza Tonno e Cipolla"] },
        fixed: ["Tè Freddo al Limone", "Panna Cotta ai Lamponi Caldi"]
    },
    menu2: {
        choices: { pasta: ["Spaghetti alla Carbonara", "Spaghetti alla Bolognese"] },
        fixed: ["Cola", "Tiramisu"]
    },
    menu3: {
        fixed: ["Energy Drink", "Grigliata Mista di Pesce", "Coppa Gelato della Casa"]
    }
};

let quantities = {};
let orders = [];
let discount = 0;
let inventory = {};
let firebaseLoaded = false;

function productKey(name){
    return name.toLowerCase()
        .replaceAll("ä","ae").replaceAll("ö","oe").replaceAll("ü","ue").replaceAll("ß","ss")
        .replaceAll("è","e").replaceAll("é","e").replaceAll("à","a").replaceAll("ì","i").replaceAll("ò","o")
        .replaceAll(" ","_").replaceAll("'","").replaceAll(".","").replaceAll(",","").replaceAll(":","");
}

function euro(value){ return value.toFixed(2).replace(".", ",") + " €"; }

function getDefaultInventory(){
    const data = {};
    Object.values(products).flat().forEach(item => {
        if(item[3]) return;
        data[productKey(item[0])] = 100;
    });
    return data;
}

async function initInventory(){
    const snap = await getDoc(inventoryRef);
    if(!snap.exists()){
        inventory = getDefaultInventory();
        await setDoc(inventoryRef, inventory);
    }
    onSnapshot(inventoryRef, (docSnap) => {
        inventory = docSnap.exists() ? docSnap.data() : getDefaultInventory();
        firebaseLoaded = true;
        document.getElementById("loadingText").style.display = "none";
        renderMenu();
        renderInventoryIfOpen();
    });
}

function renderMenu(){
    const menu = document.getElementById("menu");
    menu.innerHTML = "";
    Object.entries(products).forEach(([category, items]) => {
        const panel = document.createElement("div");
        panel.className = "panel";
        panel.innerHTML = `<h2>${category}</h2>`;
        items.forEach((item, index) => {
            const id = productKey(category) + "_" + index;
            const isMenu = item[3];
            let stockHtml = "";
            let choiceHtml = "";
            if(quantities[id] === undefined) quantities[id] = 0;
            if(isMenu){
                const recipe = menuRecipes[item[3]];
                stockHtml = `<div class="stock">Lager wird von Einzelprodukten abgezogen</div>`;
                if(recipe.choices && recipe.choices.pizza){
                    choiceHtml += `<select class="choice-select" id="choice-${id}-pizza">${recipe.choices.pizza.map(p => `<option value="${p}">${p}</option>`).join("")}</select>`;
                }
                if(recipe.choices && recipe.choices.pasta){
                    choiceHtml += `<select class="choice-select" id="choice-${id}-pasta">${recipe.choices.pasta.map(p => `<option value="${p}">${p}</option>`).join("")}</select>`;
                }
            } else {
                const key = productKey(item[0]);
                const stock = inventory[key] ?? 0;
                const stockClass = stock <= 10 ? "stock low-stock" : "stock";
                stockHtml = `<div class="${stockClass}">Lager: ${stock}</div>`;
            }
            panel.innerHTML += `
                <div class="item">
                    <div class="food-icon">${item[2]}</div>
                    <div>
                        <div class="name">${item[0]}</div>
                        <div class="price">${euro(item[1])}</div>
                        ${stockHtml}
                        ${choiceHtml}
                    </div>
                    <div class="controls">
                        <button class="small" onclick="changeQty('${id}',-1)">−</button>
                        <div class="qty" id="qty-${id}">${quantities[id] || 0}</div>
                        <button class="small" onclick="changeQty('${id}',1)">+</button>
                        <button class="small quick" onclick="changeQty('${id}',5)">+5</button>
                        <button class="small quick" onclick="changeQty('${id}',10)">+10</button>
                        <button class="add-btn" onclick="addItem('${item[0]}',${item[1]},'${id}','${item[3] || ""}')">HINZUFÜGEN</button>
                    </div>
                </div>`;
        });
        menu.appendChild(panel);
    });
}

function buildRecipe(menuCode, id){
    if(!menuCode) return null;
    const recipe = menuRecipes[menuCode];
    const ingredients = [...(recipe.fixed || [])];
    let choiceText = "";
    if(recipe.choices && recipe.choices.pizza){
        const pizza = document.getElementById(`choice-${id}-pizza`).value;
        ingredients.push(pizza);
        choiceText += ` | Pizza: ${pizza}`;
    }
    if(recipe.choices && recipe.choices.pasta){
        const pasta = document.getElementById(`choice-${id}-pasta`).value;
        ingredients.push(pasta);
        choiceText += ` | Pasta: ${pasta}`;
    }
    return {ingredients, choiceText};
}

function changeQty(id, amount){
    quantities[id] = Math.max(0, (quantities[id] || 0) + amount);
    const el = document.getElementById("qty-" + id);
    if(el) el.innerText = quantities[id];
}

function addItem(name, price, id, menuCode){
    const qty = quantities[id] || 0;
    if(qty <= 0){ alert("Bitte Menge auswählen."); return; }
    const recipe = buildRecipe(menuCode, id);
    orders.push({
        id: Date.now() + Math.random(),
        name: name + (recipe ? recipe.choiceText : ""),
        price,
        qty,
        ingredients: recipe ? recipe.ingredients : [name]
    });
    quantities[id] = 0;
    const qtyEl = document.getElementById("qty-" + id);
    if(qtyEl) qtyEl.innerText = 0;
    renderOrder();
}

function removeItem(id){ orders = orders.filter(item => item.id !== id); renderOrder(); }
function setDiscount(value){ discount = value; renderOrder(); }
function removeDiscount(){ discount = 0; renderOrder(); }

function getSubtotal(){ return orders.reduce((sum, item) => sum + item.price * item.qty, 0); }
function getTotal(){ const subtotal = getSubtotal(); return subtotal - subtotal * discount / 100; }

function renderOrder(){
    const list = document.getElementById("orderList");
    list.innerHTML = "";
    if(orders.length === 0){
        list.innerHTML = `<div style="padding:15px;color:#bfa36a">Keine Artikel ausgewählt</div>`;
    }
    orders.forEach(item => {
        list.innerHTML += `<div class="order-row"><div>${item.qty}x ${item.name}</div><div>${euro(item.price * item.qty)}</div><button class="remove" onclick="removeItem(${item.id})">×</button></div>`;
    });
    document.getElementById("total").innerText = euro(getTotal());
}

function getNeededIngredients(){
    const needed = {};
    orders.forEach(item => {
        item.ingredients.forEach(ingredient => {
            const key = productKey(ingredient);
            needed[key] = (needed[key] || 0) + item.qty;
        });
    });
    return needed;
}

function checkInventoryLocal(){
    const needed = getNeededIngredients();
    for(const key in needed){
        if((inventory[key] ?? 0) < needed[key]){
            alert("Nicht genug Lagerbestand für: " + key.replaceAll("_"," "));
            return false;
        }
    }
    return true;
}

async function reduceInventoryInFirebase(){
    const needed = getNeededIngredients();
    await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(inventoryRef);
        if(!snap.exists()) throw new Error("Inventur-Dokument fehlt.");
        const current = snap.data();
        const updated = {...current};
        for(const key in needed){
            const stock = current[key] ?? 0;
            if(stock < needed[key]){
                throw new Error("Nicht genug Lagerbestand für: " + key.replaceAll("_"," "));
            }
            updated[key] = stock - needed[key];
        }
        transaction.set(inventoryRef, updated);
    });
}

async function openInventory(){
    const pass = prompt("Admin Passwort eingeben:");
    if(pass !== adminPassword){ alert("Falsches Passwort!"); return; }
    renderInventory();
    document.getElementById("inventoryModal").style.display = "block";
}

function closeInventory(){ document.getElementById("inventoryModal").style.display = "none"; }

function renderInventoryIfOpen(){
    const modal = document.getElementById("inventoryModal");
    if(modal && modal.style.display === "block") renderInventory();
}

function renderInventory(){
    const list = document.getElementById("inventoryList");
    list.innerHTML = "";
    Object.values(products).flat().forEach(item => {
        if(item[3]) return;
        const key = productKey(item[0]);
        list.innerHTML += `<div class="inventory-row"><div>${item[2]} ${item[0]}</div><input type="number" min="0" value="${inventory[key] ?? 0}" id="inv-${key}"></div>`;
    });
}

async function saveInventory(){
    const newInventory = {...inventory};
    Object.values(products).flat().forEach(item => {
        if(item[3]) return;
        const key = productKey(item[0]);
        const value = parseInt(document.getElementById("inv-" + key).value);
        newInventory[key] = isNaN(value) ? 0 : value;
    });
    await setDoc(inventoryRef, newInventory);
    alert("Lager wurde für alle Mitarbeiter gespeichert.");
    closeInventory();
}

async function saveSaleToFirebase(sale){
    await addDoc(collection(db, "sales"), {...sale, createdAt: serverTimestamp()});
}

async function sendDiscordLog(){
    if(!webhookURL || webhookURL === "DEIN_DISCORD_WEBHOOK_HIER_EINFÜGEN") return;
    const employee = document.getElementById("employee").value;
    const orderText = orders.map(item => `${item.qty}x ${item.name} - ${euro(item.price * item.qty)}`).join("\\n");
    await fetch(webhookURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            embeds:[{
                title:"🍷 Neue Bestellung - La Casa del Nonno",
                color:11141120,
                description:orderText,
                fields:[
                    {name:"Mitarbeiter", value:employee, inline:true},
                    {name:"Rabatt", value:discount + "%", inline:true},
                    {name:"Gesamt", value:euro(getTotal()), inline:true}
                ],
                footer:{text:"La Casa del Nonno"},
                timestamp:new Date()
            }]
        })
    });
}

async function finishOrder(){
    if(!firebaseLoaded){ alert("Firebase lädt noch. Bitte kurz warten."); return; }
    if(orders.length === 0){ alert("Keine Bestellung vorhanden."); return; }
    if(!checkInventoryLocal()) return;
    const employee = document.getElementById("employee").value;
    const sale = {
        employee,
        discount,
        subtotal: getSubtotal(),
        total: getTotal(),
        items: orders.map(item => ({
            name: item.name, qty: item.qty, price: item.price,
            total: item.price * item.qty, ingredients: item.ingredients
        })),
        date: new Date().toLocaleString("de-DE")
    };
    try{
        await reduceInventoryInFirebase();
        await saveSaleToFirebase(sale);
        await sendDiscordLog();
        alert("Bestellung abgeschlossen. Lager wurde für alle Mitarbeiter aktualisiert.");
        orders = [];
        discount = 0;
        renderOrder();
    }catch(error){
        alert(error.message || "Fehler beim Abschließen der Bestellung.");
        console.error(error);
    }
}

window.changeQty = changeQty;
window.addItem = addItem;
window.removeItem = removeItem;
window.setDiscount = setDiscount;
window.removeDiscount = removeDiscount;
window.openInventory = openInventory;
window.closeInventory = closeInventory;
window.saveInventory = saveInventory;
window.finishOrder = finishOrder;

initInventory();
renderOrder();
</script>
</body>
</html>
